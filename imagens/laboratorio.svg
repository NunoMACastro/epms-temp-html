<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <!-- O Laboratório Trancado, uma das salas de fuga fictícias do exercício:
       uma bancada com três frascos de cores diferentes, à frente de um quadro
       com contas a meio, e a porta fechada com um cadeado de quatro números.
       Desenho feito para o exercício. -->
  <rect x="0" y="0" width="400" height="300" fill="#eef3f8"/>
  <rect x="0" y="250" width="400" height="50" fill="#d5dbe1"/>

  <!-- A porta, com o puxador. -->
  <rect x="24" y="60" width="90" height="190" fill="#8b5a2b" stroke="#6b4226" stroke-width="4"/>
  <circle cx="100" cy="150" r="5" fill="#f6d365"/>

  <!-- O cadeado de quatro números, pendurado ao lado do puxador. -->
  <path d="M74 166 V156 A10 10 0 0 1 94 156 V166" fill="none" stroke="#7f8c8d" stroke-width="4"/>
  <rect x="62" y="164" width="44" height="26" rx="3" fill="#5d6d7e"/>
  <rect x="65" y="169" width="8" height="16" fill="#ffffff"/>
  <rect x="75" y="169" width="8" height="16" fill="#ffffff"/>
  <rect x="85" y="169" width="8" height="16" fill="#ffffff"/>
  <rect x="95" y="169" width="8" height="16" fill="#ffffff"/>
  <text x="69" y="182" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#2c3e50" text-anchor="middle">0</text>
  <text x="79" y="182" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#2c3e50" text-anchor="middle">0</text>
  <text x="89" y="182" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#2c3e50" text-anchor="middle">0</text>
  <text x="99" y="182" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#2c3e50" text-anchor="middle">0</text>

  <!-- O quadro verde, com as contas escritas a giz. A última ficou a meio. -->
  <rect x="150" y="36" width="220" height="112" fill="#2f4f3f" stroke="#6b4226" stroke-width="5"/>
  <text x="166" y="72" font-family="Courier New, monospace" font-size="18" fill="#f4f6f7">7 x 3 = 21</text>
  <text x="166" y="100" font-family="Courier New, monospace" font-size="18" fill="#f4f6f7">21 + 18 = 39</text>
  <text x="166" y="128" font-family="Courier New, monospace" font-size="18" fill="#f4f6f7">39 : 3 =</text>

  <!-- A bancada de madeira, com duas pernas. -->
  <rect x="140" y="200" width="240" height="12" fill="#6b4226"/>
  <rect x="150" y="212" width="10" height="38" fill="#6b4226"/>
  <rect x="360" y="212" width="10" height="38" fill="#6b4226"/>

  <!-- Os três frascos: o mesmo desenho, deslocado para a direita com o
       translate, cada um com um líquido de outra cor. -->
  <g>
    <polygon points="177,184 203,184 212,200 168,200" fill="#27ae60"/>
    <polygon points="184,158 196,158 196,172 212,200 168,200 184,172" fill="none" stroke="#5d6d7e" stroke-width="2"/>
  </g>
  <g transform="translate(70,0)">
    <polygon points="177,184 203,184 212,200 168,200" fill="#2e86c1"/>
    <polygon points="184,158 196,158 196,172 212,200 168,200 184,172" fill="none" stroke="#5d6d7e" stroke-width="2"/>
  </g>
  <g transform="translate(140,0)">
    <polygon points="177,184 203,184 212,200 168,200" fill="#c0392b"/>
    <polygon points="184,158 196,158 196,172 212,200 168,200 184,172" fill="none" stroke="#5d6d7e" stroke-width="2"/>
  </g>
</svg>
